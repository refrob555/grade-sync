name: decode-mec163-screenshots
on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/screenshots/*.b64.part*'
      - 'docs/screenshots/*.png.b64'
      - '.github/workflows/decode-mec163-screenshots.yml'
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and decode scrubbed PNGs
        run: |
          set -euo pipefail
          cd docs/screenshots
          for label in home results; do
            parts=(mec163-${label}-0.5.15-scrubbed.png.b64.part*)
            if [ -e "${parts[0]}" ]; then
              cat "${parts[@]}" > "/tmp/${label}.b64"
              base64 -d "/tmp/${label}.b64" > "mec163-${label}-0.5.15-scrubbed.png"
              echo "wrote mec163-${label}-0.5.15-scrubbed.png ($(wc -c < mec163-${label}-0.5.15-scrubbed.png) bytes)"
              rm -f "${parts[@]}"
            elif [ -f "mec163-${label}-0.5.15-scrubbed.png.b64" ]; then
              base64 -d "mec163-${label}-0.5.15-scrubbed.png.b64" > "mec163-${label}-0.5.15-scrubbed.png"
              rm -f "mec163-${label}-0.5.15-scrubbed.png.b64"
            fi
          done
          rm -f _probe*.txt _probe_b64content.png test-encoding.txt mec163-*.parts.txt
          ls -la
          cd ../..
          rm -f .github/workflows/decode-mec163-screenshots.yml
      - name: Commit PNGs and cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "docs: add scrubbed MEC-163 PNG screenshots (0.5.15)"
          git push
