name: decode-screenshots
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and decode scrubbed PNGs
        run: |
          set -euo pipefail
          cd docs/screenshots
          for course in mec153 mec163; do
            for label in home results; do
              base="${course}-${label}-0.5.15-scrubbed.png"
              parts=(${base}.b64.part*)
              if [ -e "${parts[0]}" ]; then
                cat "${parts[@]}" > "/tmp/${base}.b64"
                base64 -d "/tmp/${base}.b64" > "${base}"
                echo "wrote ${base} ($(wc -c < ${base}) bytes)"
                file "${base}" || true
                head -c 8 "${base}" | od -An -tx1
                rm -f "${parts[@]}"
              elif [ -f "${base}.b64" ]; then
                base64 -d "${base}.b64" > "${base}"
                rm -f "${base}.b64"
              fi
            done
          done
          rm -f _probe* test-encoding.txt mec163-*.parts.txt *.b64
          ls -la
          cd ../..
          rm -f .github/workflows/decode-screenshots.yml
          rm -f .github/workflows/decode-mec163-screenshots.yml
      - name: Commit PNGs and cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "docs: add scrubbed MEC-153/163 PNG screenshots (0.5.15)"
          git push
